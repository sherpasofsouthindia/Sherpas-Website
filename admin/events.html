<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Events & Rides</title>

<link rel="stylesheet" href="css/admin.css">
<link rel="stylesheet" href="css/events-admin.css">
<link rel="stylesheet" href="css/event-poster-viewer.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

<!-- Sidebar -->
    <aside class="sidebar">

        <img src="assets/logo.png" class="logo">

        <h2>SHERPAS</h2>

        <p>Ride • Explore • Conquer</p>

        <nav>

            <a href="dashboard.html"> <i class="fa-solid fa-chart-line"></i>Dashboard</a>

            <a href="members.html"> <i class="fa-solid fa-users"></i> Members </a>

            <a class="active"> <i class="fa-solid fa-calendar-days"></i>Events & Rides </a>

            <a href="gallery.html"> <i class="fa-solid fa-image"></i> Gallery </a>

            <a href="messages.html"> <i class="fa-solid fa-envelope"></i> Messages </a>

            <a href="settings.html"> <i class="fa-solid fa-gear"></i> Settings  </a>

            <a href="login.html"> <i class="fa-solid fa-right-from-bracket"></i> Logout </a>

            </nav>

    </aside>

<!-- Content -->

<main class="content">

<header class="events-header">

<h1>Events & Rides</h1>

<button id="addEventBtn">

<i class="fa-solid fa-plus"></i>

Add Event

</button>

</header>

<div class="search-box">

<input
type="text"
id="searchEvent"
placeholder="Search Events">

</div>

<div id="eventsTable"></div>

</main>

</div>

<!-- Modal -->

<div id="eventModal" class="modal">

<div class="modal-content">

<span class="close">&times;</span>

<h2>Add Event</h2>

<form id="eventForm">

<input
type="text"
id="eventName"
placeholder="Event Name"
required>

<input
type="date"
id="eventDate"
required>

<select id="eventCategory">

<option>Ride</option>

<option>Event</option>

<option>Meeting</option>

<option>Workshop</option>

</select>

<input
type="time"
id="eventTime"
required>

<input
type="text"
id="eventLocation"
placeholder="Location"
required>

<textarea
id="eventDescription"
rows="4"
placeholder="Event Description"></textarea>

<input
type="url"
id="registrationLink"
placeholder="Registration Link">

<input
type="file"
id="poster">

<img id="posterPreview">

<button type="submit">

Save Event

</button>

</form>

</div>

</div>

<!-- ==========================================
     POSTER VIEWER
========================================== -->

<div
    id="posterViewer"
    class="poster-viewer">

    <div class="poster-viewer-content">

        <button
            type="button"
            id="closePosterViewer"
            class="poster-viewer-close">

            &times;

        </button>


        <img
            id="fullPosterImage"
            src=""
            alt="Event Poster">

    </div>

</div>

<!-- EVENT POSTER LIGHTBOX -->

<div id="posterLightbox" class="poster-lightbox">

    <button
        type="button"
        class="poster-lightbox-close"
        id="posterLightboxClose"
        aria-label="Close poster"
    >
        &times;
    </button>

    <img
        id="posterLightboxImage"
        src=""
        alt="Event Poster"
    >

</div>

<script src="js/events-admin.js"></script>

<script src="js/form-utils.js"></script>
<script src="js/admin-auth.js"></script>

</body>

</html>
