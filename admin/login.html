<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sherpas Admin Login</title>

    <link rel="stylesheet"
          href="css/login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <img src="assets/logo.png"
             class="logo"
             alt="Sherpas">

        <h1>SHERPAS</h1>

        <p class="subtitle">
            South India's Riding Brotherhood
        </p>

        <h2>Admin Login</h2>

        <form id="loginForm">

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Admin Email"
                    required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required>

            </div>

            <button type="submit">

                Login

            </button>

        </form>

        <p class="copyright">

            © 2026 Sherpas of South India

        </p>

    </div>

</div>

<script src="js/login.js"></script>
<script src="js/form-utils.js"></script>

</body>

</html>
